[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
biometric = "1.1.0"
work = "2.9.1"
material = "1.10.0"
activityKtx = "1.13.0"
constraintlayout = "2.1.4"
navigationFragmentKtx = "2.9.8"
navigationUiKtx = "2.9.8"
recyclerview = "1.3.2"
playServicesNearby = "19.3.0"
playServicesCodeScanner = "16.1.0"
zxingCore = "3.5.3"
barcodeScanningCommon = "17.0.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# The app lock's prompt. Worth the dependency rather than calling the framework's BiometricPrompt
# directly: the framework class is API 28+, and only from 30 does it accept a device-credential
# fallback — below that it has to be routed through KeyguardManager's confirm-credential intent.
# AndroidX hides that split behind one call, which matters at minSdk 26.
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# The study reminder's scheduling. Chosen over a bare AlarmManager because WorkManager persists its
# queue across reboots and process death by itself — the alternative is a BOOT_COMPLETED receiver,
# its permission, and remembering to re-arm from it — and because it already knows how to behave
# under Doze, which a daily nudge has to survive.
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# Offline peer-to-peer for the live whiteboard session. Picks BLE/Bluetooth/Wi-Fi Direct/hotspot
# itself and supplies discovery, encryption, framing and reconnect — the layers the original
# hand-rolled WifiP2pManager plan was going to write by hand.
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "playServicesNearby" }
# Scans the join QR without Quill holding CAMERA: the scanner UI belongs to Play Services and only
# the decoded string comes back. A permission not asked for is one that can't be denied.
play-services-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "playServicesCodeScanner" }
# Generating the QR, which the scanner library doesn't do. Pure-Java, no Android dependency.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
barcode-scanning-common = { group = "com.google.mlkit", name = "barcode-scanning-common", version.ref = "barcodeScanningCommon" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

