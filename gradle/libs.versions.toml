[versions]
agp = "9.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.6.1"
biometric = "1.1.0"
work = "2.9.1"
material = "1.10.0"
activityKtx = "1.13.0"
# Not used directly by anything. Play Services drags androidx.fragment onto :wear's classpath at
# 1.1.0, and lint's InvalidFragmentVersionForActivityResult fails the release build on anything
# below 1.3.0. Pinned to what :app already resolves through navigation-fragment-ktx, so the two
# modules agree. See the constraint in wear/build.gradle.kts.
fragment = "1.6.2"
constraintlayout = "2.1.4"
navigationFragmentKtx = "2.9.8"
navigationUiKtx = "2.9.8"
recyclerview = "1.3.2"
playServicesNearby = "19.3.0"
playServicesCodeScanner = "16.1.0"
zxingCore = "3.5.3"
barcodeScanningCommon = "17.0.0"
# Wear OS companion (:wear only). Kotlin is confined to that module — see note.md for why the
# tile libraries force it. Tiles 1.6.2 declares protolayout 1.4.2, so the two lines move together.
kotlin = "2.4.10"
playServicesWearable = "20.0.1"
wearTiles = "1.6.2"
protolayout = "1.4.2"
watchfaceComplications = "1.3.0"
wearRemoteInteractions = "1.2.0"
# The phase-2 review screen. Wear Compose is its own Material line — androidx.wear.compose, not
# androidx.compose.material3 — because a watch's components differ in kind and not just in size
# (TimeText, the round-screen-aware scaffold), so the phone's M3 artifact is the wrong one here.
# Not the newest (2026.08.00): that pins Compose 1.12, which requires compileSdk 37, and :wear
# compiles against 36 like the rest of the project. Held here until the whole project moves.
composeBom = "2026.06.01"
wearCompose = "1.6.2"
activityCompose = "1.13.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
# The app lock's prompt. Worth the dependency rather than calling the framework's BiometricPrompt
# directly: the framework class is API 28+, and only from 30 does it accept a device-credential
# fallback — below that it has to be routed through KeyguardManager's confirm-credential intent.
# AndroidX hides that split behind one call, which matters at minSdk 26.
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
# The study reminder's scheduling. Chosen over a bare AlarmManager because WorkManager persists its
# queue across reboots and process death by itself — the alternative is a BOOT_COMPLETED receiver,
# its permission, and remembering to re-arm from it — and because it already knows how to behave
# under Doze, which a daily nudge has to survive.
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# Offline peer-to-peer for the live whiteboard session. Picks BLE/Bluetooth/Wi-Fi Direct/hotspot
# itself and supplies discovery, encryption, framing and reconnect — the layers the original
# hand-rolled WifiP2pManager plan was going to write by hand.
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "playServicesNearby" }
# Scans the join QR without Quill holding CAMERA: the scanner UI belongs to Play Services and only
# the decoded string comes back. A permission not asked for is one that can't be denied.
play-services-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "playServicesCodeScanner" }
# Generating the QR, which the scanner library doesn't do. Pure-Java, no Android dependency.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
barcode-scanning-common = { group = "com.google.mlkit", name = "barcode-scanning-common", version.ref = "barcodeScanningCommon" }

# ── Wear OS ───────────────────────────────────────────────────────────────────────────────────
# The Data Layer, on both sides of the pair: the phone publishes the due-card projection as a
# DataItem and the watch listens for it. Same library, opposite ends — so this one is a dependency
# of :app as well as :wear, unlike everything below it.
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
# The tile surface. `tiles` is the service and the timeline; the layout itself is ProtoLayout,
# which is a description of a layout rather than a view hierarchy — the tile is rendered by the
# system in another process, so there is nothing to hold a reference to and no draw call to make.
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }
# Material 3 Expressive components for the tile. Kotlin-only — no Java builders exist — which is
# the concrete reason :wear is a Kotlin module. The Java-friendly alternative is the Material 2.5
# `protolayout-material`, which would put the watch surface off the app's own design system.
protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "protolayout" }
# The watch-face complication: the due count alone, on whatever face the user is wearing.
watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchfaceComplications" }
# Opening the phone app from the watch. Phase 1's tile has nowhere on-watch to send a tap yet, and
# "open Quill on your phone" is a real answer rather than a placeholder — RemoteActivityHelper is
# what turns an Intent into one that starts on the paired handset.
wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
# ── The review screen (phase 2) ────────────────────────────────────────────────────────────────
# The BOM pins the androidx.compose.* artifacts (ui, runtime, foundation) that Wear Compose builds
# on; the wear-compose lines carry their own version because they ship on a separate cadence and
# are deliberately not in the BOM.
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
# Wear's own Material 3, not the phone's. Ships TimeText and a scaffold that understands a round
# screen — the components differ in kind from the handset set, not merely in size.
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Check and Close for the review screen's two answers. The *core* set, not `-extended`: core is a
# few dozen icons and these two are in it, while extended is a five-figure icon count and several
# MB that R8 has to strip back out again. Versioned by the BOM.
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Required from Kotlin 2.0 whenever `buildFeatures.compose` is on — the Compose compiler ships as a
# Kotlin plugin rather than inside AGP. Note this is *not* the `kotlin.android` plugin, which AGP 9
# already registers and which fails if applied a second time; the two are unrelated despite the
# similar ids, and only this one belongs in :wear.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

